# Pre-commit hooks for pingboard.
# Install once with:  pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.17.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # ESLint + Prettier run via the project's own scripts (local hooks) so they
  # use the exact versions pinned in package.json — the same command CI runs.
  - repo: local
    hooks:
      - id: eslint-prettier
        name: eslint + prettier (pnpm lint)
        entry: pnpm lint
        language: system
        pass_filenames: false
        types_or: [ts, javascript, json, css, html]
