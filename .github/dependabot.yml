# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Node / npm updates.
  - package-ecosystem: 'npm'
    directories: ['/']
    # One grouped PR for everything — including majors. This lab tracks the
    # latest versions of the whole stack on purpose, so there is no reason to
    # split majors into separate PRs (that only produced noise). Grouping keeps
    # it to a single, reviewable PR per cycle.
    groups:
      all-dependencies:
        patterns: ['*']
        update-types: ['major', 'minor', 'patch']
    open-pull-requests-limit: 10
    schedule:
      interval: 'daily'
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7

  # Dockerfile updates (single image at the repo root).
  - package-ecosystem: 'docker'
    directories: ['/']
    schedule:
      interval: 'daily'
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7

  # GitHub Actions workflow updates.
  - package-ecosystem: 'github-actions'
    directories: ['/']
    schedule:
      interval: 'daily'
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
